<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Producto - Kaso Sekai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #FFC0CB !important; font-family: Arial, sans-serif; }
        .kaso-header { background-color: #ff78db; padding: 15px 0; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .kaso-header img { width: 100px; display: block; margin: 0 auto; }
        .kaso-header h1 { color: #ff2277; font-weight: bold; margin-top: 10px; }
        .card-modificar { background-color: white; border-radius: 20px; border: none; }
        .btn-kaso { background-color: #ff2277; color: white; font-weight: bold; border-radius: 50px; }
        label { color: #ff2277; font-weight: bold; font-size: 0.85rem; }
    </style>
</head>
<body>

<header class="kaso-header">
    <a href="index.html"><img src="img/Logo.png" alt="Logo"></a>
    <h1>Kaso Sekai</h1>
</header>

<div class="container d-flex justify-content-center mb-5">
    <div class="card card-modificar p-4 shadow-lg" style="width: 550px;">
        <h3 class="text-center mb-4" style="color: #ff2277;">✏️ Editar Registro</h3>
        
        <form action="modificarproducto.php" method="post">
            <div class="mb-3">
                <label class="form-label">ID del Producto a modificar</label>
                <input type="number" name="productoID" class="form-control border-danger" placeholder="Ingrese el ID" required>
            </div>

            <div class="row">
                <div class="col-md-8 mb-3">
                    <label class="form-label">Nombre del Producto</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">SKU</label>
                    <input type="text" name="sku" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Precio ($)</label>
                    <input type="number" step="0.01" name="precio" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number" name="stock" class="form-control" required>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">Nombre del Cliente</label>
                    <input type="text" name="nombre_cliente" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select">
                        <option value="1">En preparación</option>
                        <option value="2">Despachado</option>
                        <option value="3">Entregado</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Imagen (nombre.jpg)</label>
                    <input type="text" name="imagen" class="form-control">
                </div>
            </div>

            <button type="submit" class="btn btn-kaso w-100 mt-3 p-2">Guardar Cambios</button>
            <a href="gerente-cuenta.php" class="btn btn-link w-100 text-secondary mt-2">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
